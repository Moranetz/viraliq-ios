name: ViralIQ
options:
  bundleIdPrefix: com.melmarion
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: Q242KWQD56
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  ViralIQ:
    type: application
    platform: iOS
    sources:
      - path: ViralIQ
    info:
      path: ViralIQ/Info.plist
      properties:
        CFBundleDisplayName: ViralIQ
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melmarion.viraliq
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  ViralIQTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ViralIQTests
    dependencies:
      - target: ViralIQ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.melmarion.viraliq.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  ViralIQ:
    build:
      targets:
        ViralIQ: all
    test:
      targets:
        - ViralIQTests
